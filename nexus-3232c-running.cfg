! ═══════════════════════════════════════════════════════════════════════════
! Cisco Nexus 3232C — 100G RoCEv2 fabric for NVIDIA DGX Spark (GB10) nodes
!
! This is the COMPLETE production config: VLAN + jumbo + PFC + the TCAM carve
! that ECN/classification require. Verified in production on a 3-node fabric
! sustaining 196.0 Gb/s per node (98.01 x 2 rails), ~2.1-2.4 us RDMA latency.
!
! Apply the SAME config to every 100G switch in the fabric — a mixed fabric
! where one switch runs PFC and another does not is worse than neither.
!
! EDIT BEFORE USE:  <VLAN-ID>  <IF-RANGE>  and the management block.
! ═══════════════════════════════════════════════════════════════════════════

! ─────────────────────────────────────────────────────────────────────────
! 0. TCAM CARVE — REQUIRED for ECN/WRED and input classification
!
! ⛔ QoS TCAM regions ship at SIZE 0. Without this carve, applying a queuing
!    or input-classification policy fails with:
!      "TCAM region is not configured. Please configure TCAM region and retry"
!
! ⚠️ You must FREE space before allocating. `tcam region qos 256` on its own
!    fails with "Aggregate TCAM region configuration exceeded the available
!    Ingress TCAM space". Shrinking a region does NOT free capacity until the
!    reload, so stage the shrink and the grow together, save, reload ONCE.
!
! ★ Safe donor on an L2-only fabric switch: racl-lite. VERIFY IT IS IDLE:
!     show ip interface brief          -> empty (no L3 interfaces)
!     show ip access-lists summary     -> only built-in CoPP, applied to nothing
!
! ⛔ REQUIRES A RELOAD. Plan a window; the fabric drops while the switch boots.
! ─────────────────────────────────────────────────────────────────────────
hardware access-list tcam region racl-lite 512
hardware access-list tcam region qos 256

! ─────────────────────────────────────────────────────────────────────────
! 1. CLASSIFICATION — RoCE on CoS 3, CNP on CoS 6
!
! ⚠️ HOST AND SWITCH MUST AGREE ON THE PRIORITY NUMBER. Priority 3 is the
!    de-facto RoCE standard. A mismatch means PFC protects a class carrying
!    nothing while real RoCE stays droppable — and it LOOKS configured.
!
! ★ If your hosts run `Priority trust state: pcp` (the Mellanox/NVIDIA default
!   when configured for RoCE) they mark CoS 3 themselves, so the switch's PFC
!   acts on that marking directly and this input policy is largely redundant.
!   Check with: mlnx_qos -i <iface>
! ─────────────────────────────────────────────────────────────────────────
class-map type qos match-all c-roce
  match cos 3
class-map type qos match-all c-cnp
  match cos 6

policy-map type qos roce-classify
  class c-roce
    set qos-group 3
  class c-cnp
    set qos-group 6

! ─────────────────────────────────────────────────────────────────────────
! 2. NETWORK-QOS — PFC (no-drop) + jumbo
!
! ⛔⛔ `system qos` accepts exactly ONE network-qos policy. Applying roce-nq
!     REPLACES any existing jumbo policy.
!
!     ⇒ class-default MUST carry `mtu 9216`. Omit it and every non-RoCE class
!       silently drops to 1500 — and RoCE's active_mtu falls 4096 -> 1024.
!       Verify host-side after applying: ibv_devinfo | grep active_mtu
!
! Jumbo numbers are deliberately mismatched:
!   switch 9216 = full L2 frame incl. headers (platform max)
!   hosts  9000 = payload only; MUST be lower or the switch drops as oversize
!   RoCE then negotiates active_mtu 4096 — the value that affects throughput
! ─────────────────────────────────────────────────────────────────────────
class-map type network-qos c-nq-roce
  match qos-group 3
class-map type network-qos c-nq-cnp
  match qos-group 6

policy-map type network-qos roce-nq
  class type network-qos c-nq-roce
    pause pfc-cos 3
    mtu 9216
  class type network-qos c-nq-cnp
    mtu 9216
  class type network-qos class-default
    mtu 9216

! ─────────────────────────────────────────────────────────────────────────
! 3. QUEUING / ECN — optional; needs the TCAM carve above
!
! ⚠️ A queuing policy must define ALL FOUR system classes (or all eight, in
!    8q mode) or it is rejected: "Queuing policy map must have exactly 4 or 8
!    internally created class-maps when applied to a target". List them with:
!      show class-map type queuing
!
! ⚠️ Every class needs priority OR bandwidth, else: "Egress policy with one or
!    more class's without priority/bandwidth info". Copy the default's shape:
!      show policy-map system type queuing
!
! ECN is the SHOCK ABSORBER (marks packets so senders throttle smoothly via
! DCQCN); PFC is the EMERGENCY BRAKE. Tuned well, ECN does nearly all the work.
! At <=3 nodes with no oversubscription, PFC alone is usually adequate; add ECN
! before ~8 nodes where many-to-one incast becomes real.
! ─────────────────────────────────────────────────────────────────────────
! policy-map type queuing roce-out
!   class type queuing c-out-q3
!     priority level 1
!     random-detect minimum-threshold 150 kbytes maximum-threshold 1500 kbytes \
!                   drop-probability 7 weight 0 ecn
!   class type queuing c-out-q2
!     bandwidth remaining percent 0
!   class type queuing c-out-q1
!     bandwidth remaining percent 0
!   class type queuing c-out-q-default
!     bandwidth remaining percent 100

! ─────────────────────────────────────────────────────────────────────────
! 4. APPLY SYSTEM-WIDE
! ─────────────────────────────────────────────────────────────────────────
system qos
  service-policy type network-qos roce-nq
!   service-policy type queuing output roce-out     ! uncomment with ECN above

! ─────────────────────────────────────────────────────────────────────────
! 5. THE FABRIC VLAN
!
! ONE VLAN + ONE SUBNET for all rails. NOT a VLAN per port — RDMA steers by
! HCA device, not by routing table, so VLAN separation buys nothing.
! Isolated L2 island: no SVI, no gateway, no DHCP.
! ─────────────────────────────────────────────────────────────────────────
vlan <VLAN-ID>
  name rdma-fabric

! ─────────────────────────────────────────────────────────────────────────
! 6. HOST-FACING PORTS — 2 per node
!
! ⛔ JUMBO NEEDS BOTH the network-qos policy above AND the per-interface `mtu`
!    here. With only the policy, `show policy-map system type network-qos`
!    reports 9216 while `show interface` still reads MTU 1500. It LOOKS
!    configured and is not. Verify with `show interface <if> | include MTU`.
!
! `spanning-tree port type edge` — forward immediately; host ports can never
! form a switching loop.
!
! Cable each node's two ports to two SEPARATE switch ports, and host-side
! ensure those cables land on DIFFERENT PCIe domains (see the README).
! ─────────────────────────────────────────────────────────────────────────
interface <IF-RANGE>
  description RoCE fabric - DGX Spark
  switchport
  switchport mode access
  switchport access vlan <VLAN-ID>
  spanning-tree port type edge
  mtu 9216
  priority-flow-control mode on
  no shutdown
!   service-policy type qos input roce-classify     ! needs the TCAM carve

! ─────────────────────────────────────────────────────────────────────────
! 7. DISCOVERY
!
! ⚠️ CDP is BLIND to DGX Sparks — they run no CDP agent. `show cdp neighbors`
!    returning nothing is NOT a cabling fault.
! ⚠️ LLDP shows only ONE MAC per port and HIDES the dual-PCIe-domain
!    presentation. To see how many host paths reach a port:
!      show mac address-table vlan <VLAN-ID>    <- reveals TWO MACs per port
! ─────────────────────────────────────────────────────────────────────────
feature lldp

! ─────────────────────────────────────────────────────────────────────────
! 8. MANAGEMENT (optional)
!
! ⚠️ `use-vrf management` is MANDATORY on syslog/NTP if mgmt0 is in that VRF —
!    without it the packets have no route. Easiest thing to get wrong on NX-OS.
! ─────────────────────────────────────────────────────────────────────────
! snmp-server community <RO-STRING> group network-operator
! logging server <SYSLOG-IP> 6 use-vrf management
! ntp server <NTP-IP> use-vrf management

! ═══════════════════════════════════════════════════════════════════════════
! SAVE, then RELOAD once if you carved TCAM in section 0.
!   copy running-config startup-config
!   reload
!
! VERIFY ON THE WIRE — never trust the config alone:
!   show interface <if> | include MTU              -> 9216, not 1500
!   show interface priority-flow-control           -> Mode On, Oper On
!   show hardware access-list tcam region          -> qos size = 256
!   show interface <if> counters errors            -> watch OutDiscards TREND
!   show mac address-table vlan <VLAN-ID>          -> 2 MACs per port
!
! From a host:
!   ping -M do -s 8972 -I <iface> <peer>           -> jumbo passes
!   ibv_devinfo | grep active_mtu                  -> 4096, not 1024
!   mlnx_qos -i <iface> | grep -A1 enabled         -> 0 0 0 1 0 0 0 0
! ═══════════════════════════════════════════════════════════════════════════
