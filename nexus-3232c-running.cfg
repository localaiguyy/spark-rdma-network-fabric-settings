! ═══════════════════════════════════════════════════════════════════════════
! Cisco Nexus 3232C — DGX Spark 100G RoCE fabric
! This is the config ACTUALLY RUNNING in production (jumbo only, no PFC).
! For the staged lossless config see nexus-3232c-pfc-ecn.md
! NX-OS 7.0(3)I4(1)
! ═══════════════════════════════════════════════════════════════════════════

! ── Jumbo frames: BOTH of the following are required ──────────────────────
! The network-qos policy alone leaves interfaces at MTU 1500 while
! "show policy-map system type network-qos" correctly reports 9216.
! It looks configured and is not. Verify with "show interface ethX/Y".

policy-map type network-qos jumbo-nq
  class type network-qos c-nq-default
    mtu 9216

system qos
  service-policy type network-qos jumbo-nq

! ── The fabric VLAN ───────────────────────────────────────────────────────
! One VLAN, one subnet, two rails per host. NOT a VLAN per port:
! RDMA binds a queue-pair to an HCA device, so it egresses that physical
! port regardless of the routing table. VLAN separation buys nothing.

vlan 150
  name rdma-fabric

! ── Host-facing ports (2 per Spark) ───────────────────────────────────────
! node1 -> Eth1/1, Eth1/2
! node2 -> Eth1/3, Eth1/4
! "spanning-tree port type edge" = forward immediately, no listening/learning
! delay. These are host ports; they will never be part of a switching loop.

interface Ethernet1/1
  switchport
  switchport mode access
  switchport access vlan 150
  spanning-tree port type edge
  mtu 9216
  no shutdown

interface Ethernet1/2
  switchport
  switchport mode access
  switchport access vlan 150
  spanning-tree port type edge
  mtu 9216
  no shutdown

interface Ethernet1/3
  switchport
  switchport mode access
  switchport access vlan 150
  spanning-tree port type edge
  mtu 9216
  no shutdown

interface Ethernet1/4
  switchport
  switchport mode access
  switchport access vlan 150
  spanning-tree port type edge
  mtu 9216
  no shutdown

! ── Discovery ─────────────────────────────────────────────────────────────
! CDP is blind here (the Sparks run no CDP agent). LLDP maps the fabric.
! NOTE: "show lldp neighbors" errors as an invalid command until enabled.
!
! LLDP shows only ONE MAC per port and hides the dual-PCIe-domain
! presentation. To see how many host paths reach a port use:
!   show mac address-table vlan 150      <- reveals TWO MACs per port

feature lldp

! ── Management ────────────────────────────────────────────────────────────
! "use-vrf management" is MANDATORY on syslog/NTP — mgmt0 lives in that VRF
! and without it the packets have no route. Easiest thing to get wrong on
! NX-OS vs IOS.

snmp-server community <READ-ONLY-STRING> group network-operator
snmp-server location <SITE>
snmp-server contact <EMAIL>
logging server <SYSLOG-IP> 6 use-vrf management
logging timestamp milliseconds
ntp server <NTP-IP> use-vrf management

! ═══════════════════════════════════════════════════════════════════════════
! VERIFY ON THE WIRE — never trust the config alone
! ═══════════════════════════════════════════════════════════════════════════
!   show interface ethernet1/1 | include MTU        -> must read 9216
!   show lldp neighbors                             -> physical link map
!   show mac address-table vlan 150                 -> 2 MACs per port
!   show interface ethernet1/1 counters errors      -> CRC/discards = 0
!
! From a host:
!   ping -M do -s 8972 -I enp1s0f0np0 192.0.2.21   -> jumbo passes
!   ibv_devinfo | grep active_mtu                   -> 4096, not 1024
